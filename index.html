<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cabin Night</title>
<meta name="description" content="A cozy two-player game night: trivia, tunes, word puzzles and guess-each-other rounds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v14H4z' fill='%23ff9a52'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
body{margin:0}
/* Layout: a snowy cabin at night. Wooden top bar, a tilted 3D map (or a fireplace mantel) as the stage, one clear action dock below. */
:root{
  color-scheme: dark;
  --night:#0e1820; --night-2:#132330; --panel:#1a2a35; --panel-2:#223541; --line:#2f4553;
  --wood:#6e4a32; --wood-2:#93633f; --wood-dk:#3a2618;
  --ink:#ecf1f3; --muted:#a3b5bf; --dim:#6f8794;
  --ember:#ff9a52; --ember-2:#e8643a; --glow:rgba(255,154,82,.35);
  --bruce:#ff8a4c; --meredith:#4fd1c5; --team:#f2c95b;
  --good:#7fd38f; --bad:#ef6b5f;
  --display:"Calistoga", "Georgia", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  --s: clamp(46px, 12.5vw, 96px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1d3446 0%, transparent 60%),
    radial-gradient(800px 500px at 50% 120%, rgba(255,140,70,.10), transparent 70%),
    var(--night);
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.2px;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#24180f,#1c130c);border-bottom:1px solid #4a3221;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#24180f}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px}
.brand svg{width:30px;height:30px;color:var(--ember)}
.brand span{font-family:var(--display);font-size:22px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px;color:var(--muted)}
.seat-btn{display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);padding:5px 12px 5px 6px;font-size:14px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#14212a}
.dot.bruce{background:var(--bruce)} .dot.meredith{background:var(--meredith)} .dot.team{background:var(--team)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* ---------- generic ---------- */
main{position:relative;z-index:2}
.screen{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;
  background:linear-gradient(180deg,#ffb06e,var(--ember-2));color:#2a1306;box-shadow:0 2px 0 #9b3d1c, 0 8px 22px rgba(232,100,58,.28);transition:transform .15s, box-shadow .15s, filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #9b3d1c}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(255,255,255,.16);box-shadow:none}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.big{padding:16px 28px;font-size:18px}
.panel{background:linear-gradient(180deg,var(--panel),#172631);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
input[type=text],textarea,select{width:100%;background:#0f1d27;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ember);outline:none;box-shadow:0 0 0 3px var(--glow)}

/* ---------- home ---------- */
.hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(40px,7vw,76px);line-height:1;color:#fff4e6;text-shadow:0 0 32px rgba(255,154,82,.35)}
.hero p{font-size:18px;color:var(--muted);max-width:44ch;margin:14px 0 0}
.window{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:18px;border:10px solid var(--wood);box-shadow:inset 0 0 0 4px var(--wood-dk),0 18px 40px rgba(0,0,0,.45);
  background:linear-gradient(180deg,#0b1a2a 0%,#173452 55%,#2b5574 100%);overflow:hidden}
.window::before,.window::after{content:"";position:absolute;background:var(--wood);z-index:3}
.window::before{left:50%;top:0;bottom:0;width:10px;transform:translateX(-50%)}
.window::after{top:50%;left:0;right:0;height:10px;transform:translateY(-50%)}
.window .hill{position:absolute;bottom:-30%;width:140%;left:-20%;height:60%;border-radius:50%;background:linear-gradient(#e9f1f5,#b9cbd6)}
.window .hill.b{bottom:-38%;left:10%;background:linear-gradient(#d7e4eb,#9fb6c4)}
.window .pine{position:absolute;bottom:18%;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:52px solid #1f3d33;filter:drop-shadow(0 -14px 0 #24473b) drop-shadow(0 -12px 0 #2a5244)}
.window .moon{position:absolute;right:16%;top:12%;width:46px;height:46px;border-radius:50%;background:#fff6dc;box-shadow:0 0 40px 10px rgba(255,246,220,.35)}
.window .glass{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 40%);z-index:2}
.window .sill{position:absolute;left:-10px;right:-10px;bottom:-10px;height:14px;background:var(--wood-2);z-index:4}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;background:#0f1d27;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.action{display:flex;flex-direction:column;gap:10px;min-width:0}
.action h2{font-size:24px}
.action p{margin:0;color:var(--muted)}
.action .grow{flex:1}
.action.primary{background:linear-gradient(160deg,#3a2414,#22170f 70%);border-color:#5b3a22}
.code-input{text-transform:uppercase;letter-spacing:.4em;font-weight:700;font-size:22px;text-align:center}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.home-lower{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.empty{color:var(--dim);font-size:14px;padding:6px 0}

/* ---------- setup ---------- */
.setup{display:grid;gap:18px;max-width:880px;margin:0 auto}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{position:relative;text-align:left;border-radius:14px;padding:16px;border:2px solid var(--line);background:#132430;display:flex;flex-direction:column;gap:6px;min-width:0}
.choice b{font-family:var(--display);font-weight:400;font-size:20px}
.choice span{color:var(--muted);font-size:14px}
.choice[aria-pressed=true]{border-color:var(--ember);background:linear-gradient(160deg,#2c2016,#132430);box-shadow:0 0 0 4px var(--glow)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.season-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.swatch{height:34px;border-radius:8px;margin-bottom:4px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:#132430;border:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--ember);flex:none;margin-top:2px}
.stake-chips{display:flex;gap:8px;flex-wrap:wrap}
.stake-chips button{border:1px dashed rgba(255,255,255,.25);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.progress{height:10px;border-radius:99px;background:#0f1d27;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember-2),#ffd08a);transition:width .4s}

/* ---------- game ---------- */
#scr-game{max-width:none;padding:0;min-height:calc(100dvh - 60px);display:grid;grid-template-rows:auto 1fr auto}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.plate{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(15,29,39,.75);border:1px solid var(--line);min-width:0;transition:box-shadow .4s, border-color .4s}
.plate.right{flex-direction:row-reverse;text-align:right}
.plate .dot{width:44px;height:44px;font-size:20px;font-family:var(--display);font-weight:400;flex:none}
.plate .meta{min-width:0}
.plate .name{font-weight:700;font-size:16px}
.plate .sub{font-size:13px;color:var(--muted)}
.plate .score{font-family:var(--display);font-size:34px;line-height:1;margin-left:auto}
.plate.right .score{margin-left:0;margin-right:auto}
.plate.active.bruce{border-color:var(--bruce);box-shadow:0 0 0 3px rgba(255,138,76,.25),0 0 30px rgba(255,138,76,.25)}
.plate.active.meredith{border-color:var(--meredith);box-shadow:0 0 0 3px rgba(79,209,197,.25),0 0 30px rgba(79,209,197,.25)}
.turnpill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted)}
.plate.active .turnpill{background:var(--ember);color:#2a1306}
.center-hud{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.center-hud .big{font-family:var(--display);font-size:20px}
.wood{display:flex;gap:3px;align-items:flex-end}
.wood i{width:8px;height:18px;border-radius:3px;background:linear-gradient(#b07443,#6e4a32);box-shadow:inset 0 2px 0 #d39a63}
.wood i.out{background:#2a3a44;box-shadow:none}
.stage{position:relative;overflow:hidden;min-height:420px;display:grid;place-items:center}
.dock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:12px 16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(14,24,32,0),rgba(14,24,32,.92) 30%);}
.status{display:flex;flex-direction:column;gap:4px;min-width:0}
.status .say{font-family:var(--display);font-size:22px;line-height:1.2}
.status .hint{color:var(--muted);font-size:14px}
.dock-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.scard{width:150px;border-radius:12px;padding:10px;background:linear-gradient(160deg,#2a3e4c,#1a2a35);border:1px solid #3d5666;display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.scard:hover{transform:translateY(-4px) rotate(-1deg)}
.scard b{font-family:var(--display);font-weight:400;font-size:16px;color:#cfe8f5}
.scard span{font-size:12px;color:var(--muted);line-height:1.35}
.stakes{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:10px;font-size:13px;
  background:repeating-linear-gradient(90deg,rgba(200,70,50,.18) 0 10px,transparent 10px 20px),repeating-linear-gradient(0deg,rgba(200,70,50,.18) 0 10px,transparent 10px 20px),#2a1d16;border:1px solid #5b3a22}
.legend{position:absolute;left:max(16px, env(safe-area-inset-left,0px));top:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(520px,60%);z-index:5}
.legend .lg{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(14,24,32,.7);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#0f1d27;box-shadow:inset 0 0 0 2px var(--c)}
.ic svg{width:14px;height:14px;color:var(--c)}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.pips i.on{background:#ffe2b8;box-shadow:0 0 6px rgba(255,200,140,.7)}

/* ---------- 3D map ---------- */
.scene{perspective:1700px;perspective-origin:50% 30%;width:100%;height:100%;display:grid;place-items:center;padding-block:40px 20px}
.board{position:relative;width:calc(var(--s)*5);height:calc(var(--s)*5);transform-style:preserve-3d;transform:rotateX(57deg) rotateZ(45deg);margin-top:calc(var(--s)*-.6)}
.board::before{content:"";position:absolute;inset:-12%;border-radius:30%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);transform:translateZ(-2px)}
.tile{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile .top,.tile .fs,.tile .fe{position:absolute;backface-visibility:visible}
.tile .top{inset:0;transform:translateZ(var(--h));background:var(--top);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset -6px -6px 14px rgba(0,0,0,.12);transition:background .6s, box-shadow .3s}
.tile .fs{left:0;top:100%;width:100%;height:var(--h);transform-origin:top;transform:rotateX(90deg);background:linear-gradient(0deg,var(--side) 0%,color-mix(in srgb,var(--side) 70%,#000) 100%)}
.tile .fe{top:0;left:100%;width:var(--h);height:100%;transform-origin:left;transform:rotateY(-90deg);background:linear-gradient(90deg,color-mix(in srgb,var(--side) 82%,#000),color-mix(in srgb,var(--side) 55%,#000))}
.tile.enter{animation:drop .9s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:var(--d)}
@keyframes drop{from{transform:translateZ(320px);opacity:0}60%{opacity:1}}
.tile.can{cursor:pointer}
.tile.can:hover,.tile.sel{transform:translateZ(10px)}
.tile.can .top{box-shadow:inset 0 0 0 2px rgba(255,226,184,.35), inset -6px -6px 14px rgba(0,0,0,.12)}
.tile.can:hover .top,.tile.sel .top{box-shadow:inset 0 0 0 3px #ffe2b8, 0 0 24px rgba(255,200,140,.7)}
.tile.sel .top{animation:selpulse 1.4s ease-in-out infinite}
@keyframes selpulse{50%{box-shadow:inset 0 0 0 3px #fff, 0 0 40px rgba(255,200,140,.95)}}
.board .tile.own-bruce .top{background:linear-gradient(rgba(255,138,76,.55),rgba(255,138,76,.55)),var(--top);box-shadow:inset 0 0 0 2px rgba(255,180,140,.9)}
.board .tile.own-meredith .top{background:linear-gradient(rgba(79,209,197,.55),rgba(79,209,197,.55)),var(--top);box-shadow:inset 0 0 0 2px rgba(150,240,230,.9)}
.board .tile.own-team .top{background:linear-gradient(rgba(242,201,91,.5),rgba(242,201,91,.5)),var(--top);box-shadow:inset 0 0 0 2px rgba(255,230,160,.9)}
.tile.dim .top{filter:brightness(.62) saturate(.7)}
.tile.lake .top{background-image:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%),var(--lake);background-size:300% 100%,100% 100%;animation:shimmer 6s linear infinite}
@keyframes shimmer{from{background-position:150% 0,0 0}to{background-position:-150% 0,0 0}}
.tile.claimed-now .top::after{content:"";position:absolute;inset:-6px;border-radius:6px;border:3px solid #fff;animation:ring .9s ease-out forwards}
@keyframes ring{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}
/* painted ring on each open tile, so a badge clearly belongs to its tile */
.mark{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent);transition:opacity .4s}
.board .tile[class*=own-] .mark{opacity:0}
/* billboards: stand upright and face the camera */
.slotbb{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.bb{position:absolute;transform-origin:50% 100%;transform:translateZ(var(--h)) rotateZ(-45deg) rotateX(-57deg);pointer-events:none;transform-style:flat}
.tree{width:calc(var(--s)*.26);height:calc(var(--s)*.42)}
.tree svg{width:100%;height:100%;display:block;overflow:visible}
.rock{width:calc(var(--s)*.3);height:calc(var(--s)*.2)}
.badge{width:calc(var(--s)*.5);height:calc(var(--s)*.66);display:flex;justify-content:center;align-items:flex-start}
.badge .float{display:flex;flex-direction:column;align-items:center;gap:3px;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:translateY(-5px)}}
.badge .disc{width:calc(var(--s)*.4);height:calc(var(--s)*.4);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#24394a,#0f1d27);box-shadow:inset 0 0 0 2px var(--c),0 4px 10px rgba(0,0,0,.45)}
.badge .disc svg{width:58%;height:58%;color:var(--c)}
.badge .pips i{width:calc(var(--s)*.07);height:calc(var(--s)*.07)}
.badge .lantern{position:absolute;margin-left:calc(var(--s)*.34);margin-top:calc(var(--s)*-.06);width:calc(var(--s)*.2);height:calc(var(--s)*.24);border-radius:5px 5px 7px 7px;background:radial-gradient(circle at 50% 55%,#fff3c4,#ffb347 55%,#b5531c);box-shadow:0 0 14px 4px rgba(255,190,90,.65);display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--s)*.15);color:#5a2a08;animation:flick 2.2s ease-in-out infinite}
@keyframes flick{40%{box-shadow:0 0 18px 6px rgba(255,190,90,.8)}60%{box-shadow:0 0 10px 3px rgba(255,190,90,.5)}}
.flag{width:calc(var(--s)*.5);height:calc(var(--s)*.85)}
.flag .pole{position:absolute;left:45%;bottom:0;width:3px;height:100%;background:linear-gradient(#e9d6b8,#8a6a48);border-radius:2px;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.9,.3,1.3) backwards}
.flag .cloth{position:absolute;left:calc(45% + 3px);top:2px;width:62%;height:42%;border-radius:2px 6px 6px 2px;background:var(--fc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transform-origin:left;animation:rise .7s .15s cubic-bezier(.2,.9,.3,1.3) backwards, wave 2.4s .9s ease-in-out infinite;display:grid;place-items:center;font-family:var(--display);color:#14212a;font-size:calc(var(--s)*.17)}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes wave{50%{transform:skewY(-6deg) scaleX(.94)}}
.cabin-deco{width:calc(var(--s)*.55);height:calc(var(--s)*.5)}
.cabin-deco svg{width:100%;height:100%;overflow:visible}
.smoke{position:absolute;left:66%;top:-10%;width:8px;height:8px;border-radius:50%;background:rgba(220,230,236,.55);animation:smoke 3s ease-out infinite}
.smoke.b{animation-delay:1s}.smoke.c{animation-delay:2s}
@keyframes smoke{from{transform:translate(0,0) scale(.6);opacity:.8}to{transform:translate(10px,-34px) scale(2);opacity:0}}

/* seasons (map palettes) */
.scene[data-season=winter]{--meadow:linear-gradient(135deg,#f6fafc,#d6e3ea);--meadow-s:#9fb4c2;--pines:linear-gradient(135deg,#dfe9ea,#bccfcf);--pines-s:#7b958f;--lake:linear-gradient(135deg,#9fd3ec,#5aa2c9);--lake-s:#3e6f8c;--ridge:linear-gradient(135deg,#eef3f6 0%,#c3ced6 45%,#8697a3 100%);--ridge-s:#5d6c77;--tree1:#1f4a3c;--tree2:#2b6150;--snowcap:#f2f7f9;--trunk:#5b3d28}
.scene[data-season=autumn]{--meadow:linear-gradient(135deg,#e7c27a,#c99a4f);--meadow-s:#8a6234;--pines:linear-gradient(135deg,#a9b35d,#7f8c3e);--pines-s:#57602a;--lake:linear-gradient(135deg,#79b7cf,#3f7f9d);--lake-s:#2d5a70;--ridge:linear-gradient(135deg,#c9b8a3,#8f7e6c);--ridge-s:#5e5145;--tree1:#c7542b;--tree2:#e9963a;--snowcap:transparent;--trunk:#4b2f1c}
.scene[data-season=spring]{--meadow:linear-gradient(135deg,#bfe39a,#8fc46b);--meadow-s:#5a8a41;--pines:linear-gradient(135deg,#8fcf8a,#5fa863);--pines-s:#3f7445;--lake:linear-gradient(135deg,#8fdcf0,#4fb2d3);--lake-s:#2f7d96;--ridge:linear-gradient(135deg,#d7dbcf,#9aa294);--ridge-s:#646d61;--tree1:#2f7a4a;--tree2:#f2a9c6;--snowcap:transparent;--trunk:#5b3d28}
.scene[data-season=aurora]{--meadow:linear-gradient(135deg,#3c4f7a,#27375c);--meadow-s:#1a2440;--pines:linear-gradient(135deg,#2d5c66,#1e3f49);--pines-s:#122a31;--lake:linear-gradient(135deg,#5fe3c4,#2b8fa8);--lake-s:#1a5868;--ridge:linear-gradient(135deg,#7b80b8,#474c82);--ridge-s:#2c3060;--tree1:#163c3a;--tree2:#2e7d6c;--snowcap:#cfe6ff;--trunk:#2b2236}
.scene[data-season=aurora]::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 30% 0%,rgba(95,227,196,.25),transparent),radial-gradient(50% 35% at 75% 5%,rgba(160,120,255,.22),transparent);animation:aur 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes aur{to{transform:translateX(6%) scaleY(1.2);opacity:.7}}

/* ---------- fireside ---------- */
.fireside{width:min(1000px,100%);display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:20px;align-items:end;padding:20px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
.slate{background:#262e2b;border:10px solid var(--wood);border-radius:10px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-family:var(--display);color:#e8efe9;text-shadow:0 0 1px rgba(255,255,255,.6)}
.slate .t{font-size:14px;opacity:.75;margin-bottom:8px}
.slate .r{display:flex;justify-content:space-between;align-items:baseline;font-size:20px}
.slate .r b{font-weight:400;font-size:30px}
.slate .tally{font-size:12px;opacity:.6;letter-spacing:2px}
.hearth{position:relative;display:flex;flex-direction:column;align-items:center}
.mantel{position:relative;width:100%;display:flex;justify-content:center;gap:clamp(8px,2vw,22px);padding:0 10px;z-index:2;flex-wrap:wrap}
.shelf{width:108%;height:22px;margin:0 -4%;border-radius:4px;background:linear-gradient(#a06c43,#6e4a32);box-shadow:0 10px 20px rgba(0,0,0,.45),inset 0 3px 0 #c58b5a;position:relative;z-index:1}
.firebox{position:relative;width:78%;aspect-ratio:2.1/1;margin-top:-2px;border-radius:0 0 6px 6px;
  background:radial-gradient(60% 70% at 50% 100%,#3b1a0a,#120a06 70%);
  border:16px solid #5d6064;border-top-width:6px;border-image:repeating-linear-gradient(90deg,#6d7175 0 28px,#55585c 28px 30px) 16;overflow:hidden}
.flame{position:absolute;bottom:-10%;left:50%;width:30%;height:90%;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;filter:blur(2px);mix-blend-mode:screen;transform-origin:50% 100%}
.flame.a{background:radial-gradient(60% 70% at 50% 75%,#fff2b0,#ffb347 40%,rgba(255,90,30,.0) 75%);animation:fl 1.1s ease-in-out infinite alternate}
.flame.b{margin-left:-22%;width:26%;height:72%;background:radial-gradient(60% 70% at 50% 75%,#ffd27a,#ff7a2e 45%,transparent 75%);animation:fl 1.4s .2s ease-in-out infinite alternate}
.flame.c{margin-left:4%;width:24%;height:66%;background:radial-gradient(60% 70% at 50% 75%,#ffe3a0,#ff8a3a 45%,transparent 75%);animation:fl 1.2s .4s ease-in-out infinite alternate}
@keyframes fl{0%{transform:translateX(-50%) scale(1,1) skewX(0)}50%{transform:translateX(-52%) scale(1.06,1.1) skewX(3deg)}100%{transform:translateX(-48%) scale(.95,.92) skewX(-3deg)}}
.logs{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);width:56%;height:16%;border-radius:20px;background:linear-gradient(#7a4a2a,#3a2214);box-shadow:0 -4px 20px rgba(255,120,40,.6)}
.hearth-glow{position:absolute;left:50%;bottom:-40px;width:120%;height:120px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,140,60,.35),transparent);pointer-events:none;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.6}}
.gift{--g:clamp(48px,7vw,74px);--gc:#b29cf5;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:6px 2px 0;perspective:500px}
.gift .box{position:relative;width:var(--g);height:var(--g);transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-28deg);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.gift .f,.gift .rt,.gift .tp{position:absolute;width:var(--g);height:var(--g);backface-visibility:hidden}
.gift .f{transform:translateZ(calc(var(--g)/2));background:linear-gradient(90deg,transparent 42%,#fff3d6 42% 58%,transparent 58%),repeating-linear-gradient(45deg,color-mix(in srgb,var(--gc) 85%,#fff) 0 8px,var(--gc) 8px 16px)}
.gift .rt{transform:rotateY(90deg) translateZ(calc(var(--g)/2));background:linear-gradient(90deg,transparent 42%,#e9d9b8 42% 58%,transparent 58%),repeating-linear-gradient(45deg,color-mix(in srgb,var(--gc) 60%,#000) 0 8px,color-mix(in srgb,var(--gc) 70%,#000) 8px 16px)}
.gift .tp{transform:rotateX(90deg) translateZ(calc(var(--g)/2));background:linear-gradient(90deg,transparent 42%,#fff 42% 58%,transparent 58%),linear-gradient(0deg,transparent 42%,#fff 42% 58%,transparent 58%),color-mix(in srgb,var(--gc) 90%,#fff);transition:transform .45s cubic-bezier(.2,.9,.3,1.4)}
.gift.mys .f,.gift.mys .tp{background:linear-gradient(90deg,transparent 42%,#ffe08a 42% 58%,transparent 58%),repeating-linear-gradient(90deg,rgba(160,30,30,.55) 0 7px,transparent 7px 14px),repeating-linear-gradient(0deg,rgba(160,30,30,.55) 0 7px,transparent 7px 14px),#3c5a3a}
.gift .tag{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(14,24,32,.8);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.gift.can:hover .box,.gift.sel .box{transform:rotateX(-16deg) rotateY(-28deg) translateY(-10px)}
.gift.sel .box{filter:drop-shadow(0 0 14px rgba(255,210,150,.9))}
.gift.sel .tp,.gift.opening .tp{transform:rotateX(90deg) translateZ(calc(var(--g)/2 + 14px)) rotateY(-8deg)}
.gift.enter{animation:pop .6s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:var(--d)}
@keyframes pop{from{transform:translateY(-40px) scale(.6);opacity:0}}
.gift[disabled]{cursor:default}
.fs-window{border:10px solid var(--wood);border-radius:12px;aspect-ratio:3/4;background:linear-gradient(#0b1a2a,#1d3c58 70%,#dfe9ef 70%);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.fs-window i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(260px)}}

/* ---------- question card ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px max(16px, env(safe-area-inset-right,0px)) 20px max(16px, env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 50% 40%,rgba(14,24,32,.55),rgba(5,10,14,.85));backdrop-filter:blur(3px);perspective:1400px;overflow-y:auto}
.qcard{position:relative;width:min(640px,100%);border-radius:20px;padding:24px;background:linear-gradient(170deg,#24394a,#162733 60%);border:1px solid #3b5566;box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);transform-origin:50% 60%}
.qcard.flip{animation:flipIn .65s cubic-bezier(.2,.9,.25,1.1)}
@keyframes flipIn{from{transform:rotateX(-75deg) translateY(60px) scale(.85);opacity:0}}
.qcard::before{content:"";position:absolute;inset:0 0 auto;height:6px;border-radius:20px 20px 0 0;background:var(--c,#ff9a52)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qhead .ic{width:34px;height:34px}
.qhead .ic svg{width:20px;height:20px}
.qhead .cat{font-weight:700}
.qhead .src{margin-left:auto}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bg{stroke:rgba(255,255,255,.1)}
.timer .fg{stroke:var(--ember);stroke-linecap:round;transition:stroke .3s}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:18px}
.timer.low .fg{stroke:var(--bad)}
.qtext{font-size:clamp(20px,3vw,26px);line-height:1.35;margin:4px 0 18px;font-weight:700;text-wrap:pretty}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;border-radius:12px;background:#0f1d27;border:2px solid #2f4553;font-size:17px;min-height:58px;transition:transform .12s,border-color .2s,background .2s}
.opt:hover{border-color:#ffd2a8;transform:translateY(-1px)}
.opt kbd{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:#223541;color:var(--muted);font:700 13px var(--body)}
.opt.picked{border-color:var(--ember);background:#2a2016}
.opt.right{border-color:var(--good);background:rgba(127,211,143,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(239,107,95,.1)}
.typed{display:flex;gap:10px}
.typed input{font-size:20px;padding:14px 16px}
.waiting{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--muted)}
.waiting .pulse{width:10px;height:10px;border-radius:50%;background:var(--c2,var(--ember));animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.6);opacity:.4}}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 18px;perspective:600px}
.letters span{width:46px;height:54px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#2a1a0d;
  background:linear-gradient(#f8e7c8,#e6c896);box-shadow:0 4px 0 #b08a55,0 8px 14px rgba(0,0,0,.35);animation:tileIn .5s cubic-bezier(.2,.9,.3,1.3) backwards}
.letters span.gap{background:none;box-shadow:none;width:14px}
@keyframes tileIn{from{transform:rotateX(90deg) translateY(-20px);opacity:0}}
.musicbox{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 18px}
.drum{width:120px;height:54px;border-radius:12px;background:repeating-linear-gradient(90deg,#c9a45a 0 6px,#e8cf8f 6px 12px);box-shadow:inset 0 6px 10px rgba(255,255,255,.35),inset 0 -8px 12px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);position:relative;overflow:hidden}
.drum::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#5a3b12 2px,transparent 2.5px) 0 0/14px 12px;opacity:.8}
.drum.playing::after{animation:spin 1s linear infinite}
@keyframes spin{to{background-position:0 24px}}
.bars{display:flex;gap:3px;align-items:flex-end;height:40px}
.bars i{width:6px;height:20%;border-radius:3px;background:var(--c);opacity:.8}
.bars.on i{animation:eq .8s ease-in-out infinite alternate}
.bars.on i:nth-child(2){animation-delay:.15s}.bars.on i:nth-child(3){animation-delay:.3s}.bars.on i:nth-child(4){animation-delay:.45s}.bars.on i:nth-child(5){animation-delay:.6s}
@keyframes eq{to{height:100%}}
.result{display:grid;gap:12px}
.result .headline{font-family:var(--display);font-size:clamp(24px,4vw,32px);line-height:1.15}
.answer-line{padding:12px 14px;border-radius:12px;background:rgba(127,211,143,.1);border:1px solid rgba(127,211,143,.35)}
.pl-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl-res .pr{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);min-width:0}
.pl-res .pr .v{font-weight:700;overflow-wrap:anywhere}
.ok{color:var(--good)} .no{color:var(--bad)}
.mys{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid #6b5124;background:linear-gradient(120deg,rgba(255,190,90,.14),rgba(255,190,90,.04));animation:mysIn .7s .35s cubic-bezier(.2,.9,.3,1.3) backwards}
.mys.bad{border-color:#6b2a2a;background:linear-gradient(120deg,rgba(239,107,95,.16),rgba(239,107,95,.04))}
@keyframes mysIn{from{transform:scale(.8) rotateX(60deg);opacity:0}}
.mys .lamp{width:30px;height:36px;border-radius:6px 6px 9px 9px;flex:none;background:radial-gradient(circle at 50% 55%,#fff3c4,#ffb347 55%,#b5531c);box-shadow:0 0 16px 4px rgba(255,190,90,.6)}
.hand-over{text-align:center;display:grid;gap:14px;justify-items:center}
.over-scores{display:flex;gap:28px;justify-content:center;align-items:flex-end}
.over-scores .s{display:grid;justify-items:center;gap:4px}
.over-scores b{font-family:var(--display);font-weight:400;font-size:46px;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* lobby */
.lobby{display:grid;gap:18px;justify-items:center;text-align:center;max-width:620px;margin:0 auto;padding:30px 16px}
.codebox{display:flex;gap:10px}
.codebox span{width:64px;height:76px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:44px;color:#2a1a0d;background:linear-gradient(#f8e7c8,#e6c896);box-shadow:0 5px 0 #b08a55,0 12px 20px rgba(0,0,0,.4);animation:tileIn .6s cubic-bezier(.2,.9,.3,1.3) backwards}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.seatcard{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seatcard .dot{width:36px;height:36px}

/* daily */
.daily{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.wgrid{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;justify-content:center;perspective:800px}
.wrow{display:grid;grid-template-columns:repeat(5,clamp(48px,11vw,62px));gap:7px}
.wrow.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wcell{aspect-ratio:1;border-radius:10px;border:2px solid #34505f;display:grid;place-items:center;font-family:var(--display);font-size:28px;text-transform:uppercase;background:#102029;transform-style:preserve-3d}
.wcell.filled{border-color:#6d8b9b;animation:popc .12s}
@keyframes popc{50%{transform:scale(1.08)}}
.wcell.g,.wcell.y,.wcell.x{border-color:transparent;animation:wflip .55s ease-in backwards;animation-delay:var(--d)}
.wcell.g{background:#4f9a62;color:#fff}.wcell.y{background:#c99a2e;color:#1d1406}.wcell.x{background:#2c3d47;color:#a8b7bf}
@keyframes wflip{0%{transform:rotateX(0);background:#102029;color:var(--ink);border-color:#6d8b9b}49%{transform:rotateX(90deg);background:#102029;color:var(--ink);border-color:#6d8b9b}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:grid;gap:6px;margin-top:18px;justify-items:center}
.kb div{display:flex;gap:5px}
.kb button{min-width:34px;height:50px;padding:0 8px;border-radius:8px;border:0;background:#2c4352;font-weight:700;text-transform:uppercase}
.kb button.wide{min-width:62px;font-size:13px}
.kb button.g{background:#4f9a62}.kb button.y{background:#c99a2e;color:#1d1406}.kb button.x{background:#1b2a33;color:#5d7380}

/* ledger */
.ledger-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bigstat{display:grid;gap:4px}
.bigstat b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1}
.h2h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar2{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#0f1d27;margin-top:10px}
.bar2 i{display:block;height:100%}
.catbars{display:grid;gap:10px}
.catbar{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.meter{height:10px;border-radius:99px;background:#0f1d27;overflow:hidden}
.meter i{display:block;height:100%}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist td,table.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tablewrap{overflow-x:auto}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;z-index:80;padding:12px 18px;border-radius:12px;background:#24394a;border:1px solid #3b5566;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .35s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.howto ol{margin:0;padding-left:20px;display:grid;gap:8px}
.close-x{position:absolute;top:12px;right:12px}

@media (max-width:900px){
  .home-grid{grid-template-columns:1fr}
  .home-lower{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .window{max-width:420px}
  .fireside{grid-template-columns:1fr}
  .fireside .slate{order:-1}
  .fs-window{display:none}
  .daily{grid-template-columns:1fr}
  .ledger-top{grid-template-columns:1fr}
  .season-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .topbar .chip{display:none}
  .brand span{font-size:19px;white-space:nowrap}
  .seat-btn{font-size:13px}
  .hud{grid-template-columns:1fr 1fr}
  .center-hud{grid-column:1/-1;order:-1}
  .plate .score{font-size:26px}
  .plate .dot{width:34px;height:34px;font-size:16px}
  .dock{grid-template-columns:1fr}
  .dock-actions{justify-content:flex-start}
  .choices{grid-template-columns:1fr}
  .choice-grid{grid-template-columns:1fr}
  .legend{display:none}
  .catbar{grid-template-columns:90px minmax(0,1fr) minmax(0,1fr)}
  .codebox span{width:52px;height:62px;font-size:34px}
  .pl-res{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

    <span>Cabin Night</span>
  </button>
  <div class="top-right">
    <span id="modeChip" class="chip" hidden>Practice mode · this device only</span>
    <button id="seatBtn" class="seat-btn" title="Switch who is playing on this device"><span class="dot" id="seatDot">?</span><span>Playing as <b id="seatName">…</b></span></button>

  </div>
</header>

<main>
  <section id="scr-home" class="screen"></section>
  <section id="scr-setup" class="screen" hidden></section>
  <section id="scr-game" class="screen" hidden>
    <div class="hud" id="hud"></div>
    <div class="stage" id="stage"></div>
    <div class="dock" id="dock"></div>
  </section>
